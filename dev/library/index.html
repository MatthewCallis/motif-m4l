<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motif Library Workbench</title>
    <link rel="stylesheet" href="./workbench.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Motif development tool</p>
          <h1>Library Workbench</h1>
          <p class="lede">The production Library page, isolated at its exact Max viewport size.</p>
        </div>
        <div id="save-status" class="status" role="status">Loading saved size…</div>
      </header>

      <section class="toolbar" aria-label="Library workbench controls">
        <div class="control-group dimensions">
          <label for="width-input">Width</label>
          <input id="width-input" data-config-key="width" type="number" inputmode="numeric" />
          <span>×</span>
          <label for="height-input">Height</label>
          <input id="height-input" data-config-key="height" type="number" inputmode="numeric" />
          <span>px</span>
        </div>

        <div class="control-group">
          <label for="fixture-select">State</label>
          <select id="fixture-select">
            <option value="normal">Normal</option>
            <option value="editing">Editing</option>
            <option value="large">Large note table</option>
            <option value="long">Long content</option>
            <option value="scanning">Scanning</option>
            <option value="empty">Empty library</option>
            <option value="warning">Warning modal</option>
          </select>
        </div>

        <div class="control-group layout-settings" aria-label="Sidebar layout settings">
          <label for="sidebar-min-width-input">Sidebar min</label>
          <input
            id="sidebar-min-width-input"
            data-config-key="sidebarMinWidth"
            type="number"
            inputmode="numeric"
            title="Smallest browser sidebar width"
          />
          <label for="sidebar-max-width-input">max</label>
          <input
            id="sidebar-max-width-input"
            data-config-key="sidebarMaxWidth"
            type="number"
            inputmode="numeric"
            title="Largest browser sidebar width"
          />
          <label for="detail-min-width-input">Detail min</label>
          <input
            id="detail-min-width-input"
            data-config-key="detailMinWidth"
            type="number"
            inputmode="numeric"
            title="Detail-pane width preserved while resizing"
          />
          <label for="sidebar-resizer-width-input">Divider</label>
          <input
            id="sidebar-resizer-width-input"
            data-config-key="sidebarResizerWidth"
            type="number"
            inputmode="numeric"
            title="Visible sidebar divider width"
          />
          <span>px</span>
        </div>

        <div class="toolbar-actions">
          <button id="reset-button" type="button">Reset</button>
          <button id="save-button" class="primary" type="button">Save to JSON</button>
        </div>
      </section>

      <section class="workspace" aria-label="Resizable Library viewport">
        <div class="ruler" aria-live="polite">
          <strong id="size-readout">— × —</strong>
          <span>Drag the lower-right corner to resize</span>
        </div>
        <div id="library-window" class="library-window">
          <iframe
            id="library-frame"
            title="Motif Library production page"
            src="/src/max/library.html?workbench=1"
          ></iframe>
        </div>
      </section>

      <details class="event-panel">
        <summary>Library action log</summary>
        <div class="event-panel-header">
          <span>Messages emitted through the simulated Max bridge</span>
          <button id="clear-log-button" type="button">Clear</button>
        </div>
        <pre id="action-log">Waiting for the Library page…</pre>
      </details>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
