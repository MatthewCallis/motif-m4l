<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motif Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #141415;
      color: #e0e0e6;
      font-family: "Ableton Sans", system-ui, -apple-system, sans-serif;
      font-size: 11px;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #roll-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #roll {
      display: block;
      width: 100%;
      height: 100%;
    }

    #note-names {
      flex-shrink: 0;
      padding: 3px 6px 2px;
      font-size: 11px;
      font-weight: 600;
      color: #e0e0e6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div id="roll-wrap"><canvas id="roll"></canvas></div>
  <div id="note-names">–</div>

  <script>
    /* Max shim — lets the file open directly in a browser for development */
    if (typeof window.max === 'undefined') {
      window.max = { outlet: (...a) => console.log('→ Max:', ...a) };
    }

    /* ------------------------------------------------------------------ */
    /*  State                                                               */
    /* ------------------------------------------------------------------ */

    /**
     * @typedef {{ pitch: number, atTicks: number, durationTicks: number }} PNote
     * @typedef {{ notes: PNote[], totalTicks: number, lowPitch: number, highPitch: number, noteNames: string }} PreviewData
     */

    /** @type {PreviewData|null} */
    let currentData = null;

    /* ------------------------------------------------------------------ */
    /*  Colours (Ableton dark palette)                                      */
    /* ------------------------------------------------------------------ */
    const C = {
      bg:         '#141415',
      roll:       '#1a1a1c',
      grid:       '#2a2a2e',
      gridOctave: '#3a3a40',
      note:       '#ff8c1f',
      noteDim:    '#b85e00',
      noteBorder: '#ffb066',
    };

    /* ------------------------------------------------------------------ */
    /*  Rendering                                                           */
    /* ------------------------------------------------------------------ */

    const canvas = document.getElementById('roll');
    const ctx    = canvas.getContext('2d');

    function dpr() { return window.devicePixelRatio || 1; }

    function resize() {
      const wrap = canvas.parentElement;
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      const r = dpr();
      canvas.width  = w * r;
      canvas.height = h * r;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.scale(r, r);
      draw();
    }

    function draw() {
      const wrap = canvas.parentElement;
      const W = wrap.clientWidth;
      const H = wrap.clientHeight;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);

      const d = currentData;
      if (!d || d.notes.length === 0) {
        ctx.fillStyle = '#4a4a50';
        ctx.font = '10px "Ableton Sans", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No motif selected', W / 2, H / 2);
        ctx.textAlign = 'left';
        return;
      }

      const { notes, totalTicks, lowPitch, highPitch } = d;
      const pitchRange = Math.max(1, highPitch - lowPitch);

      /* padding so top/bottom note isn't flush with edge */
      const PAD_X = 2;
      const PAD_Y = 2;
      const rollW = W - PAD_X * 2;
      const rollH = H - PAD_Y * 2;

      /* semi-tone row height */
      const semitoneH = rollH / (pitchRange + 1);

      /* Background: alternating rows for black/white keys */
      const BLACK_KEYS = new Set([1, 3, 6, 8, 10]); // C♯ D♯ F♯ G♯ A♯
      for (let p = lowPitch; p <= highPitch; p++) {
        const isBlack = BLACK_KEYS.has(p % 12);
        const y = PAD_Y + (highPitch - p) * semitoneH;
        ctx.fillStyle = isBlack ? C.roll : C.bg;
        ctx.fillRect(PAD_X, y, rollW, semitoneH);
      }

      /* Horizontal grid lines every semitone */
      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 0.5;
      for (let p = lowPitch; p <= highPitch; p++) {
        const y = Math.round(PAD_Y + (highPitch - p) * semitoneH) + 0.5;
        ctx.beginPath();
        ctx.moveTo(PAD_X, y);
        ctx.lineTo(PAD_X + rollW, y);
        ctx.stroke();
      }

      /* Octave boundary grid lines (thicker, lighter) */
      ctx.strokeStyle = C.gridOctave;
      ctx.lineWidth = 1;
      for (let p = lowPitch; p <= highPitch; p++) {
        if (p % 12 === 0) { /* C note = octave boundary */
          const y = Math.round(PAD_Y + (highPitch - p) * semitoneH) + 0.5;
          ctx.beginPath();
          ctx.moveTo(PAD_X, y);
          ctx.lineTo(PAD_X + rollW, y);
          ctx.stroke();
        }
      }

      /* Notes */
      for (const note of notes) {
        const x = PAD_X + (note.atTicks / totalTicks) * rollW;
        const w = Math.max(2, (note.durationTicks / totalTicks) * rollW - 1);
        const y = PAD_Y + (highPitch - note.pitch) * semitoneH + 1;
        const h = Math.max(2, semitoneH - 1);

        /* shadow / glow */
        ctx.fillStyle = C.noteDim;
        ctx.fillRect(x + 1, y + 1, w, h);

        /* body */
        ctx.fillStyle = C.note;
        ctx.fillRect(x, y, w, h);

        /* top highlight */
        ctx.fillStyle = C.noteBorder;
        ctx.fillRect(x, y, w, 1);
      }

      /* Pitch labels on the left for visible C notes */
      ctx.fillStyle = '#6a6a72';
      ctx.font = `${Math.min(9, Math.max(6, semitoneH - 1))}px "Ableton Sans", system-ui, sans-serif`;
      ctx.textAlign = 'left';
      for (let p = lowPitch; p <= highPitch; p++) {
        if (p % 12 === 0) {
          const octave = Math.floor(p / 12) - 2;
          const y = PAD_Y + (highPitch - p) * semitoneH + semitoneH - 1;
          ctx.fillText(`C${octave}`, PAD_X + 2, y);
        }
      }
    }

    /* ------------------------------------------------------------------ */
    /*  Public API — called by Max via `call receiveData encodedJson`       */
    /* ------------------------------------------------------------------ */

    /**
     * @param {string} encoded - URL-encoded compact JSON
     */
    function receiveData(encoded) {
      try {
        currentData = JSON.parse(decodeURIComponent(String(encoded)));
      } catch (e) {
        console.error('preview: bad payload', e);
        currentData = null;
      }
      const names = currentData?.noteNames ?? '–';
      document.getElementById('note-names').textContent = names;
      draw();
    }

    /* ------------------------------------------------------------------ */
    /*  Bootstrap                                                           */
    /* ------------------------------------------------------------------ */

    window.addEventListener('resize', resize);

    /* Expose globally so Max `call receiveData` finds it */
    window.receiveData = receiveData;

    resize();

    /* Dev-mode: seed with sample Mitsuda-style phrase for local testing */
    if (window.max.outlet.toString().includes('console.log')) {
      const mockNotes = [
        { pitch: 60, atTicks: 0,    durationTicks: 240 },
        { pitch: 63, atTicks: 240,  durationTicks: 240 },
        { pitch: 65, atTicks: 480,  durationTicks: 120 },
        { pitch: 67, atTicks: 600,  durationTicks: 120 },
        { pitch: 65, atTicks: 720,  durationTicks: 240 },
        { pitch: 63, atTicks: 960,  durationTicks: 480 },
        { pitch: 60, atTicks: 1440, durationTicks: 480 },
      ];
      receiveData(encodeURIComponent(JSON.stringify({
        notes: mockNotes,
        totalTicks: 1920,
        lowPitch: 59,
        highPitch: 68,
        noteNames: 'C3  ·  E♭3  ·  F3  ·  G3  ·  F3  ·  E♭3  ·  C3',
      })));
    }
  </script>
</body>
</html>
